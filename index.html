<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קדימה צורן - הבית החדש שלך</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fff; color: #1d1d1f; overflow-x: hidden; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        h1 { font-size: 5rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -2px; }
        p { font-size: 1.5rem; color: #86868b; margin-bottom: 30px; max-width: 600px; }
        .hero-image { width: 100%; max-width: 1000px; height: 500px; background: #f5f5f7; border-radius: 20px; margin-top: 40px; display: flex; align-items: center; justify-content: center; color: #86868b; font-size: 1.2rem; background-image: url('https://images.unsplash.com/photo-1541888946425-d81bb1924155?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; }
        section { padding: 100px 20px; text-align: center; }
        .footer { padding: 50px; color: #86868b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>קדימה צורן.</h1>
        <p>קהילה שצומחת יחד. איכות חיים, טבע ושלווה במרחק נגיעה.</p>
        <div class="hero-image"></div>
    </div>
    <section>
        <h2>ירוק בעיניים</h2>
        <p>מרחבים פתוחים, חיי קהילה תוססים ושקט של כפר.</p>
    </section>
    <div class="footer">© 2026 קדימה צורן. כל הזכויות שמורות.</div>
</body>
</html>
