<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Pro Concept</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 5rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -2px; }
        p { font-size: 1.5rem; color: #86868b; margin-bottom: 30px; }
        .btn { background: #0071e3; color: white; padding: 12px 24px; border-radius: 980px; text-decoration: none; font-size: 1.1rem; transition: background 0.3s; }
        .btn:hover { background: #0077ed; }
        .image-placeholder { 
            width: 80%; 
            max-width: 800px; 
            height: 400px; 
            background: linear-gradient(135deg, #111, #000); 
            border-radius: 20px; 
            margin-top: 50px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            border: 1px solid #333; 
            background-image: url('https://picsum.photos/800/400');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>עתיד החזון</h1>
        <p>טכנולוגיה פורצת דרך, עטופה באלגנטיות.</p>
        <a href="#" class="btn">למידע נוסף</a>
        <div class="image-placeholder">תמונה מרהיבה של המוצר כאן</div>
    </div>
</body>
</html>
